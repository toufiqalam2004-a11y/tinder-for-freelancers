<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#FAF7F2" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="Discover freelance jobs and client opportunities that match your skills. Swipe. Match. Get Hired." />
    <meta property="og:title" content="Tinder for Freelancers — Swipe. Match. Get Hired." />
    <meta property="og:description" content="Discover freelance jobs and client opportunities that match your skills." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tinder for Freelancers" />
    <title>Tinder for Freelancers — Swipe. Match. Get Hired.</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script>
      // Prevent theme flicker before React mounts
      (function() {
        try {
          var saved = localStorage.getItem('tf_theme_mode') || localStorage.getItem('applyai_theme_mode');
          var isDark = saved === 'dark' || ((!saved || saved === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background text-text-primary font-sans antialiased overscroll-none">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
